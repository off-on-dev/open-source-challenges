app:
  title: Scaffolded Backstage App
  baseUrl: http://localhost:3000

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  extensions:
    # Configure the catalog index page to be the root page, this is normally mounted on /catalog
    - page:catalog:
        config:
          path: /
    # Show Argo CD's live sync/health on each vessel's page. The card reads the
    # vessel's "argocd/app-name" annotation and fetches that Application through
    # the "/argocd/api" proxy (see proxy + argocd config below). type:content
    # puts the wide status table in the page's main column.
    - entity-card:argocd/overviewCard:
        config:
          type: content
    # The overview card is enough; hide the Argo CD history card and the plugin's
    # standalone ARGOCD tab (otherwise empty-looking).
    - entity-card:argocd/historyCard: false
    - entity-content:argocd/ArgoCdPage: false
    # A vessel has no dependency graph in this challenge, so drop the empty
    # relationship cards to keep the page focused on the delivery pipeline.
    - entity-card:catalog/depends-on-components: false
    - entity-card:catalog/depends-on-resources: false
    - entity-card:catalog/has-subcomponents: false
    # Links card (right rail) surfaces the vessel's deployment repository, which
    # the template records in metadata.links. Code stays reachable via About's
    # "View Source".
    - entity-card:catalog/links:
        config:
          type: info

organization:
  name: My Company

backend:
  auth:
    # This is a throwaway, single-user challenge environment. Disabling the
    # default auth policy lets local tooling (the verify script) call the
    # scaffolder and catalog APIs without a token. Paired with
    # permission.enabled: false below. Do not copy this into a real deployment.
    dangerouslyDisableDefaultAuthPolicy: true
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # In-memory SQLite: the catalog is rebuilt on every start, which is all this
  # challenge needs.
  database:
    client: better-sqlite3
    connection: ':memory:'
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  # Gitea runs in-cluster and is exposed on the NodePort below. Backstage talks
  # to it with basic auth using the admin credentials provisioned by the Gitea
  # Helm chart, so the scaffolder's publish:gitea action can create repositories.
  # baseUrl must be set explicitly: without it the integration defaults to
  # https://<host>, but Gitea serves plain HTTP here (ERR_SSL_WRONG_VERSION_NUMBER).
  gitea:
    - host: localhost:30112
      baseUrl: http://localhost:30112
      username: admin
      password: a-super-secure-password

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  providers:
    # See https://backstage.io/docs/auth/guest/provider
    guest: {}
  # see https://backstage.io/docs/ai/mcp-actions#client-id-metadata-documents
  # to learn more about client id metadata documents
  experimentalClientIdMetadataDocuments:
    enabled: false
    # Optional: restrict which `client_id` URLs are allowed (defaults to ['*'])
    # allowedClientIdPatterns:
    #   - 'https://example.com/*'
    #   - 'https://*.trusted-domain.com/*'
    # Optional: restrict which redirect URIs are allowed (defaults to ['*'])
    # allowedRedirectUriPatterns:
    #   - 'http://localhost:*'
    #   - 'https://*.example.com/*'

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

  # Where the commission office sends its traces. Every vessel commissioned here
  # emits a trace over OTLP/HTTP to the OpenTelemetry Collector, which forwards
  # it to Jaeger. Point this at the collector's OTLP/HTTP endpoint.
  tracing:
    endpoint: http://localhost:30107

# The cards in the frontend can't call the cluster directly, so the backend
# proxies for them. Both Argo CD (run with --insecure) and Argo Workflows serve
# plain HTTP on their NodePorts, so these targets are http.
proxy:
  endpoints:
    # Argo CD still requires auth even with --insecure, so we pass a session
    # cookie: ARGOCD_AUTH_TOKEN is minted from the read-only account by
    # `make backstage` and looks like "argocd.token=<jwt>".
    '/argocd/api':
      target: http://localhost:30100/api/v1/
      changeOrigin: true
      headers:
        Cookie: ${ARGOCD_AUTH_TOKEN}
    # For the custom "Delivery workflows" card. Argo Workflows runs with
    # --auth-mode=server, so the server acts as its own identity and the API
    # needs no client token. The target ends in /api/v1 so the card can call
    # ".../argo-workflows/workflows/<namespace>".
    '/argo-workflows':
      target: http://localhost:30113/api/v1
      changeOrigin: true
    # For the custom "Voyage log" card: Jaeger's query API. Jaeger serves plain
    # HTTP on its NodePort; the target ends in /api so the card can call
    # ".../jaeger/api/traces?service=backstage&operation=commission <vessel>".
    '/jaeger/api':
      target: http://localhost:30103/api
      changeOrigin: true

# baseUrl is only used for each card's deep link (opened in the browser); the
# actual data goes through the proxies above. In a Codespace these are overridden
# with the forwarded URLs (app-config.codespaces.yaml).
argocd:
  baseUrl: http://localhost:30100

argoWorkflows:
  baseUrl: http://localhost:30113

jaeger:
  baseUrl: http://localhost:30103

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    # The vessel commissioning template, loaded straight off disk. In a real
    # setup a platform team would author it in its own repo and Backstage would
    # auto-discover it; bundling it here keeps the challenge self-contained and
    # reliable in both local and Codespace runs.
    - type: file
      target: ../../templates/vessel-commissioning-template/template.yaml
      rules:
        - allow: [Template]

    # Organizational data: the guest user, and the squadron groups the
    # OwnerPicker offers as owners.
    - type: file
      target: ../../catalog/org.yaml
      rules:
        - allow: [User, Group]

    # The fleets a vessel can be assigned to, offered by the EntityPicker.
    - type: file
      target: ../../catalog/fleet.yaml
      rules:
        - allow: [System]

    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
    #   rules:
    #     - allow: [User, Group]

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # Disabled so the verify script can read the catalog and run the scaffolder
  # without a permission token. See backend.auth above.
  enabled: false
