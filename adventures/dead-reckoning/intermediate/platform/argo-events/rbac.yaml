# RBAC for the Sensor. Its "sensor-trigger" SA (in argo-events) needs to submit
# Workflows from the ci-build template over in argo-workflows. Least privilege:
# submitting is a single create, and the workflowTemplateRef is resolved by the
# Argo Workflows controller (not this SA), so no read on workflowtemplates.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sensor-trigger
  namespace: argo-events
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: submit-workflow
  namespace: argo-workflows
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sensor-submit-workflow
  namespace: argo-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: submit-workflow
subjects:
  - kind: ServiceAccount
    name: sensor-trigger
    namespace: argo-events
